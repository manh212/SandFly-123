name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 of SandFly's signing certificate. Published builds must be signed with it.
  SANDFLY_CERT_SHA256: 7fde506fa8d1652fb21f1bc8f9fd98666f7a92187636340f4b95672d4068f3f8

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # The full history gives the build number (commits since buildNumberBase in version.gradle) and the release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      # Signs builds with SandFly's key, so that installed builds update in place. Pull requests
      # from forks do not get the secrets, so they are signed with a new debug key.
      - name: Install SandFly's signing key
        env:
          KEYSTORE: ${{ secrets.SANDFLY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/sandfly.jks"
            echo "SANDFLY_KEYSTORE=$RUNNER_TEMP/sandfly.jks" >> "$GITHUB_ENV"
            echo "Installed SandFly's signing key."
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "The SANDFLY_KEYSTORE_BASE64 secret is missing, so the build can't be published." >&2
            exit 1
          else
            echo "No signing key secret, so the build uses a new debug key."
          fi

      # A tag v<version> builds the stable release of that version.
      - name: Check the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ *sandflyVersion = "\(.*\)"/\1/p' version.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but version.gradle says $version." >&2
            exit 1
          fi
          echo "GRADLE_RELEASE_FLAG=-Psandfly.release=true" >> "$GITHUB_ENV"

      # AGP downloads the SDK platform and NDK it needs if the runner lacks them.
      - name: Build debug APKs
        env:
          SANDFLY_KEY_PASSWORD: ${{ secrets.SANDFLY_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug $GRADLE_RELEASE_FLAG --console=plain 2>&1 | tee "$RUNNER_TEMP/assemble.log"

      - name: Check the signing key
        if: github.event_name == 'push'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in build/outputs/apk/*/debug/*.apk; do
            certs=$("$apksigner" verify --print-certs "$apk" 2>&1) || {
              echo "$certs" >&2
              echo "apksigner could not check $apk." >&2
              exit 1
            }
            if ! grep -q "certificate SHA-256 digest: $SANDFLY_CERT_SHA256" <<< "$certs"; then
              echo "$certs" >&2
              echo "$apk is not signed with SandFly's key." >&2
              exit 1
            fi
          done

      # Only the phone flavor exists, so only its unit tests run.
      - name: Run unit tests
        run: ./gradlew testPhoneDebugUnitTest --console=plain

      # The app's lint also checks the library modules. Issues already in lint-baseline.xml are
      # allowed, so this fails only on new errors, such as a call that needs a newer Android than
      # minSdk without a version check.
      - name: Run lint
        run: ./gradlew :lintPhoneDebug --console=plain

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            build/reports/lint-results-phoneDebug.html

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error

      # On a failed pull request build, posts one comment on the pull request summarizing
      # the failure (failed steps, the tail of the APK build's Gradle output, lint errors,
      # failing unit tests) from the files on the runner, so the cause can be read without
      # opening the full Actions log. It never prints environment values, drops any line
      # that mentions a credential, and can never fail the build itself.
      - name: Comment on the pull request with the failure summary
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          blocked='password|secret|keystore'
          lint_out="$RUNNER_TEMP/lint-errors.txt"
          : > "$lint_out"
          lint_file=$(find . -path '*build/reports/lint-results-*.txt' -type f 2>/dev/null | head -n 1)
          if [ -n "$lint_file" ]; then
            grep -E ': Error:' "$lint_file" 2>/dev/null | grep -Evi "$blocked" | head -n 40 > "$lint_out"
          fi
          head -c 6000 "$lint_out" > "$lint_out.tmp" && mv "$lint_out.tmp" "$lint_out"
          assemble_out="$RUNNER_TEMP/assemble-tail.txt"
          : > "$assemble_out"
          if [ -f "$RUNNER_TEMP/assemble.log" ]; then
            tail -n 150 "$RUNNER_TEMP/assemble.log" | grep -Evi "$blocked" > "$assemble_out" || true
          fi
          head -c 12000 "$assemble_out" > "$assemble_out.tmp" && mv "$assemble_out.tmp" "$assemble_out"
          tests_out="$RUNNER_TEMP/test-failures.txt"
          python3 - > "$tests_out" <<'PYEOF'
          import glob, re, sys
          import xml.etree.ElementTree as ET
          blocked = re.compile(r'password|secret|keystore', re.I)
          shown = 0
          for path in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  node = case.find('failure')
                  if node is None:
                      node = case.find('error')
                  if node is None:
                      continue
                  name = (case.get('classname') or '') + '.' + (case.get('name') or '')
                  message = (node.get('message') or '').strip().splitlines()
                  line = '- ' + name + ((': ' + message[0]) if message else '')
                  if blocked.search(line):
                      continue
                  print(line[:300])
                  shown += 1
                  if shown >= 20:
                      sys.exit(0)
          PYEOF
          head -c 6000 "$tests_out" > "$tests_out.tmp" && mv "$tests_out.tmp" "$tests_out"
          summary="$RUNNER_TEMP/failure-summary.md"
          {
            echo "## Build failed"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            failed_steps=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[] | select(.name == "build") | .steps[] | select(.conclusion == "failure") | .name] | join(", ")' 2>/dev/null)
            if [ -n "$failed_steps" ]; then
              echo
              echo "**Failed steps:** $failed_steps"
            fi
            if [ -s "$assemble_out" ]; then
              echo
              echo "### Gradle output (last lines of the APK build)"
              echo
              echo '```'
              cat "$assemble_out"
              echo '```'
            fi
            if [ -s "$lint_out" ]; then
              echo
              echo "### Lint errors"
              echo
              echo '```'
              cat "$lint_out"
              echo '```'
            fi
            if [ -s "$tests_out" ]; then
              echo
              echo "### Failing unit tests"
              echo
              cat "$tests_out"
            fi
          } > "$summary"
          gh pr comment "$PR_NUMBER" --body-file "$summary"

  # Publishes the build. A push to master replaces the rolling "dev" pre-release, and a tag
  # v<version> creates the stable release, which becomes the latest release. The in-app updater
  # reads both. The first line of the notes is "build: <build number>", and each "- <short hash>
  # <subject>" line is a change, newest first. A stable release also gets the notes in
  # release-notes/<version>.md, whose list items must start with "* ", not "- ".
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(sed -n 's/^def buildNumberBase = "\([0-9a-f]*\)"/\1/p' version.gradle)
          count=$(git rev-list --count "$base..HEAD")
          hash=$(git rev-parse HEAD)
          short=${hash:0:7}
          # The phone build is sandfly.apk, which the updater on phones looks for.
          apk=$(find apks -name "sandfly-phone-debug.apk" | head -n 1)
          if [ -z "$apk" ]; then
            echo "The phone APK was not found." >&2
            exit 1
          fi
          cp "$apk" sandfly.apk

          # %H cut to 7 characters, since %h can be longer when a short hash is ambiguous.
          changes() {
            git log --format='%H %s' "$@" | while IFS= read -r line; do
              echo "- ${line:0:7} ${line:41}"
            done
          }

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            previous=$(git describe --tags --abbrev=0 --match 'v*' "HEAD^" 2>/dev/null || true)
            notes="release-notes/${tag#v}.md"
            {
              echo "build: $count"
              echo
              if [ -f "$notes" ]; then
                cat "$notes"
                echo
              fi
              if [ -n "$previous" ]; then
                echo "Changes since $previous:"
                echo
                changes "$previous..HEAD"
              else
                echo "The first release of SandFly. Latest changes:"
                echo
                changes -n 50 HEAD
              fi
            } > release-notes.md
            gh release create "$tag" sandfly.apk --verify-tag --latest \
              --title "SandFly ${tag#v}" --notes-file release-notes.md
            exit 0
          fi

          {
            echo "build: $count"
            echo
            changes -n 50 HEAD
          } > release-notes.md
          title="Development build $count ($short)"
          tag=dev
          if gh release view "$tag" > /dev/null 2>&1; then
            # Update the release in place. Deleting and creating it again counts as a new release,
            # which notifies everyone watching the repository.
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
            gh release upload "$tag" sandfly.apk --clobber
            gh release edit "$tag" --title "$title" --notes-file release-notes.md --prerelease --latest=false
          else
            gh release create "$tag" sandfly.apk --prerelease --latest=false --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md
          fi
