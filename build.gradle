// For building the open-source release of TalkBack.

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.compose) apply false
}

apply from: 'shared.gradle'

apply from: 'version.gradle'

dependencies {
    implementation project(':talkback')
}

// SandFly's signing key: SANDFLY_KEYSTORE, or ~/.android/sandfly-release.jks, with its password in
// SANDFLY_KEY_PASSWORD, or on a Mac in the Keychain item "SandFly Android signing key". Without
// them, builds are signed with the debug key, and cannot update or be updated by SandFly's builds.
def sandflyKeystore = file(System.getenv("SANDFLY_KEYSTORE") ?: "${System.getProperty("user.home")}/.android/sandfly-release.jks")
def sandflyKeyPassword = System.getenv("SANDFLY_KEY_PASSWORD") ?: ""
if (sandflyKeyPassword.isEmpty() && sandflyKeystore.isFile() && new File("/usr/bin/security").canExecute()) {
    try {
        sandflyKeyPassword = providers.exec {
            commandLine("/usr/bin/security", "find-generic-password", "-a", "sandfly", "-s", "SandFly Android signing key", "-w")
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
    }
}
def signWithSandflyKey = sandflyKeystore.isFile() && !sandflyKeyPassword.isEmpty()

android {
    namespace = "com.android.talkback"
    if (signWithSandflyKey) {
        signingConfigs {
            sandfly {
                storeFile = sandflyKeystore
                storePassword = sandflyKeyPassword
                keyAlias = "sandfly"
                keyPassword = sandflyKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId = talkbackApplicationId
        // The version code is 100000000 plus the build number. Gboard does its own touch typing,
        // which types a key when the finger slides off the keyboard, unless the screen reader's
        // package has the support_lift_to_type meta-data and a version code of at least 60105832.
        versionCode = 100000000 + gitCommitCount
        versionName = sandflyVersionName
        minSdk = 26
        targetSdk = 36
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
        multiDexEnabled = true
        // This fork ships only English and Vietnamese resources. The sources keep every
        // language; only the packaged app is filtered.
        resConfigs "en", "vi"
    }
    buildTypes {
        // The published builds are debug builds, signed with SandFly's key. Android runs a
        // debuggable app without compiling it, which makes navigation several times slower on
        // a watch, so they are not debuggable. Debug logging in the libraries stays on.
        debug {
            debuggable = false
            if (signWithSandflyKey) {
                signingConfig = signingConfigs.sandfly
            }
        }
    }
    packaging {
        resources {
            excludes += ['LICENSE', 'README']
        }
        jniLibs {
            // On-device AI only runs on arm64-v8a (see OnDeviceAiSettings), so its 26 MB library
            // would never load on x86_64.
            excludes += ['lib/x86_64/liblitertlm_jni.so']
        }
    }
    androidResources {
        // Only the English and Vietnamese emoji names are packaged, with the index.
        // Emoji names are the app's only .gz assets and are named by language code,
        // so ignore every .gz asset except those three.
        ignoreAssetsPatterns += ['*.gz', '!emoji.gz', '!en.gz', '!vi.gz',
                                 '!*/emoji.gz', '!*/en.gz', '!*/vi.gz']
    }
    lint {
        checkReleaseBuilds = false
        // Lint the library modules too, where most of the code is, in one report.
        checkDependencies = true
        // The issues that were already there when lint was added to CI. Only new ones fail the
        // build. To accept new ones on purpose, run ./gradlew updateLintBaselinePhoneDebug.
        baseline = file("lint-baseline.xml")
        abortOnError = true
    }
    productFlavors {
        phone {
            dimension = "target"
        }
    }
}

// The packaged APK must match the slimming rules: arm64-v8a libraries only, only
// the English and Vietnamese emoji names, and no phonetic letters table. Checking
// the built APK itself keeps a green build meaning the exclusions really applied.
def verifyPackagedApk = tasks.register("verifyPackagedApk") {
    doLast {
        def apkDir = project.layout.buildDirectory.dir("outputs/apk").get().asFile
        def apkFiles = project.fileTree(apkDir).include("**/*.apk").files
        if (apkFiles.isEmpty()) {
            throw new GradleException("verifyPackagedApk: no APK found under ${apkDir}")
        }
        // Entry names in the APK: aapt strips the .gz suffix from asset names.
        def keptEmojiNames = ["assets/emoji_names/emoji", "assets/emoji_names/en",
                              "assets/emoji_names/vi", "assets/emoji_names/LICENSE"] as Set
        apkFiles.each { apkFile ->
            def zip = new java.util.zip.ZipFile(apkFile)
            try {
                def entries = zip.entries().collect { it.name }
                def emojiNames = entries.findAll { it.startsWith("assets/emoji_names/") }
                if (emojiNames.size() > 5 || !emojiNames.containsAll(keptEmojiNames)) {
                    throw new GradleException("verifyPackagedApk: ${apkFile.name} should " +
                            "package only ${keptEmojiNames}, but has ${emojiNames}")
                }
                def abis = entries.findAll { it.startsWith("lib/") }
                        .collect { it.substring(4, it.indexOf('/', 4)) }.unique()
                if (abis != ["arm64-v8a"]) {
                    throw new GradleException("verifyPackagedApk: ${apkFile.name} should " +
                            "package only arm64-v8a libraries, but has ${abis}")
                }
                if (entries.any { it.contains("phonetic_letters") }) {
                    throw new GradleException("verifyPackagedApk: ${apkFile.name} still " +
                            "packages the phonetic letters table")
                }
            } finally {
                zip.close()
            }
        }
    }
}

tasks.named("assembleDebug") {
    finalizedBy(verifyPackagedApk)
}
