plugins { id 'com.android.application' }
android {
  namespace 'com.sandfly.offlinelicenser'
  compileSdk 36
  defaultConfig {
    applicationId 'com.sandfly.offlinelicenser.v2'
    minSdk 26
    targetSdk 35
    versionCode Integer.parseInt(System.getenv('MERIDIAN_ADMIN_VERSION_CODE') ?: '2')
    versionName '2.0'
  }
  buildTypes {
    debug {
      debuggable false
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    release {
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  def signingPath = System.getenv('SANDFLY_KEYSTORE')
  if (signingPath) {
    signingConfigs {
      official {
        storeFile file(signingPath)
        storePassword System.getenv('SANDFLY_KEY_PASSWORD')
        keyAlias 'sandfly'
        keyPassword System.getenv('SANDFLY_KEY_PASSWORD')
      }
    }
    buildTypes.debug.signingConfig = signingConfigs.official
    buildTypes.release.signingConfig = signingConfigs.official
  }
  sourceSets {
    main.java.srcDir('../../../activation/src/main/java')
    test.java.setSrcDirs([layout.buildDirectory.dir('generated/protocol-tests').get().asFile, 'protocol-tests'])
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation 'androidx.activity:activity:1.10.1'
  implementation 'androidx.browser:browser:1.9.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
def protocolTests = tasks.register('prepareProtocolTests', Sync) {
  from(file('../../../talkback/src/test/java/com/google/android/accessibility/talkback/licensing')) {
    include 'RecoveryProtocolTest.java', 'CatalogPublisherTest.java', 'LicensePolicyTest.java', 'SupportProtocolTest.java', 'FirebaseRestIdentityTest.java', 'SupportAttachmentTest.java', 'PrivateLogFilesTest.java'
  }
  into layout.buildDirectory.dir('generated/protocol-tests')
}
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
  if (name.contains('UnitTest')) dependsOn(protocolTests)
}

ext.activationDirectory = file('../../../activation')
apply from: new File(activationDirectory, 'service-assets.gradle')
