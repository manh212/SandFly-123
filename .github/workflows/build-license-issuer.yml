name: Build Meridian Admin APK
on:
  push:
    branches: [master]
    paths:
      - 'tools/sandfly-license-issuer/**'
      - 'activation/**'
      - '.github/workflows/build-license-issuer.yml'
      - 'scripts/check_activation_obfuscation.py'
      - 'talkback/src/test/java/com/google/android/accessibility/talkback/licensing/RecoveryProtocolTest.java'
      - 'talkback/src/test/java/com/google/android/accessibility/talkback/licensing/CatalogPublisherTest.java'
      - 'talkback/src/test/java/com/google/android/accessibility/talkback/licensing/LicensePolicyTest.java'
      - 'talkback/src/test/java/com/google/android/accessibility/talkback/licensing/SupportProtocolTest.java'
      - 'talkback/src/test/java/com/google/android/accessibility/talkback/licensing/FirebaseRestIdentityTest.java'
      - 'talkback/src/test/java/com/google/android/accessibility/talkback/licensing/SupportAttachmentTest.java'
      - 'talkback/src/test/java/com/google/android/accessibility/talkback/licensing/PrivateLogFilesTest.java'
  workflow_dispatch:

concurrency:
  group: meridian-admin-${{ github.ref }}
  cancel-in-progress: true

env:
  SANDFLY_CERT_SHA256: 7fde506fa8d1652fb21f1bc8f9fd98666f7a92187636340f4b95672d4068f3f8

jobs:
  firebase-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test private enrollment rules
        working-directory: activation/firebase
        run: |
          set -o pipefail
          npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/firebase-rules.log"
          npx firebase emulators:exec --project demo-meridian-licensing --only database 'node --test rules.test.cjs' 2>&1 | tee -a "$RUNNER_TEMP/firebase-rules.log"
      - name: Collect rules failure logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/firebase-rules.log" > gradle-log-tail.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-log-tail
          path: gradle-log-tail.txt
  build:
    needs: firebase-rules
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install stable APK signing identity
        env:
          KEYSTORE: ${{ secrets.SANDFLY_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SANDFLY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$SIGNING_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/meridian-admin.jks"
          echo "SANDFLY_KEYSTORE=$RUNNER_TEMP/meridian-admin.jks" >> "$GITHUB_ENV"
          echo "MERIDIAN_ADMIN_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Test protocols, browser session validation and GitHub conflict handling
        env:
          SANDFLY_KEY_PASSWORD: ${{ secrets.SANDFLY_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p tools/sandfly-license-issuer :app:testDebugUnitTest --tests 'com.google.android.accessibility.talkback.licensing.RecoveryProtocolTest' --tests 'com.google.android.accessibility.talkback.licensing.CatalogPublisherTest' --tests 'com.google.android.accessibility.talkback.licensing.LicensePolicyTest' --tests 'com.sandfly.offlinelicenser.GitHubAppProtocolTest' --tests 'com.sandfly.offlinelicenser.SupportLogDownloadTest' --tests 'com.google.android.accessibility.talkback.licensing.SupportProtocolTest' --tests 'com.google.android.accessibility.talkback.licensing.FirebaseRestIdentityTest' --tests 'com.google.android.accessibility.talkback.licensing.SupportAttachmentTest' --tests 'com.google.android.accessibility.talkback.licensing.PrivateLogFilesTest' --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/issuer-tests.log"
      - name: Build admin APK
        env:
          SANDFLY_KEY_PASSWORD: ${{ secrets.SANDFLY_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p tools/sandfly-license-issuer :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/issuer-build.log"
      - name: Verify admin obfuscation in the APK
        run: |
          set -o pipefail
          python3 scripts/check_activation_obfuscation.py \
            --apk tools/sandfly-license-issuer/app/build/outputs/apk/debug/app-debug.apk \
            --mapping tools/sandfly-license-issuer/app/build/outputs/mapping/debug/mapping.txt \
            --namespace com.sandfly.offlinelicenser \
            --namespace io.meridian.licensing \
            --entrypoint com.sandfly.offlinelicenser.MainActivity \
            --entrypoint com.sandfly.offlinelicenser.SyncJobService \
            --entrypoint com.sandfly.offlinelicenser.BrowserConnectionService \
            --member 'com.sandfly.offlinelicenser.MainActivity#authenticate' \
            --member 'com.sandfly.offlinelicenser.MainActivity#createKey' \
            --member 'com.sandfly.offlinelicenser.MainActivity#refresh' \
            --member 'com.sandfly.offlinelicenser.MainActivity#pendingRequest' \
            --member 'com.sandfly.offlinelicenser.MainActivity#issued' 2>&1 | tee "$RUNNER_TEMP/issuer-obfuscation.log"
      - name: Verify stable APK signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs tools/sandfly-license-issuer/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/admin-certificate.txt"
          grep -q "certificate SHA-256 digest: $SANDFLY_CERT_SHA256" "$RUNNER_TEMP/admin-certificate.txt"
          cp tools/sandfly-license-issuer/app/build/outputs/apk/debug/app-debug.apk meridian-admin.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meridian-Admin-APK
          path: meridian-admin.apk
          if-no-files-found: error
      - name: Publish admin APK on the dev channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload dev meridian-admin.apk --clobber
      - name: Collect admin failure logs
        if: always()
        run: |
          python3 - <<'PYEOF'
          import os
          from pathlib import Path
          import re
          lines = []
          blocked = re.compile(r'password|secret|keystore', re.I)
          for name in ['issuer-tests.log', 'issuer-build.log', 'issuer-obfuscation.log']:
              path = Path(os.environ['RUNNER_TEMP']) / name
              if path.exists():
                  lines.append('===== ' + name + ' =====')
                  lines.extend(line for line in path.read_text().splitlines()[-200:] if not blocked.search(line))
          Path('gradle-log-tail.txt').write_text('\n'.join(lines) + '\n')
          PYEOF
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-log-tail
          path: gradle-log-tail.txt
          if-no-files-found: ignore
