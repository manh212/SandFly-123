android.useAndroidX = true
android.enableJetifier = false
org.gradle.jvmargs=-Xms512M -Xmx8G

android.nonTransitiveRClass=false

## Enables parallel execution of tasks.
org.gradle.parallel=true

## Reuses task outputs from earlier builds. On GitHub Actions, setup-gradle saves the cache
## between runs.
org.gradle.caching=true

## R8 trial: the published builds (the debug build type, see build.gradle) are shrunk and
## optimized with R8, and soaked on the dev channel before any stable release uses it.
## This line is the off switch: set it to false to turn R8 off again. A single build can
## override it with -Psandfly.r8=false.
sandfly.r8=true
