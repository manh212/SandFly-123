plugins { id 'com.android.application' }
android {
  namespace 'com.sandfly.offlinelicenser'
  compileSdk 35
  defaultConfig {
    applicationId 'com.sandfly.offlinelicenser'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '1.0'
  }
  buildTypes {
    debug {
      debuggable false
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    release {
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
