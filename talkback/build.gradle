plugins {
    id 'com.android.library'
}

apply from: "../shared.gradle"

dependencies {
    implementation project(':proguard')
    implementation project(':utils')
    implementation project(':materialflags')
    implementation project(':materialpreference')
    // Scripts run in Lua 5.4 through LuaJava.
    phoneImplementation libs.luajava
    phoneImplementation libs.luajava.lua54
    phoneImplementation project(':luamemory')
    // The Lua 5.4 library for each Android ABI, and for the computer that runs the unit tests.
    phoneRuntimeOnly "party.iroiro.luajava:android:${libs.versions.luajava.get()}:lua54@aar"
    testPhoneRuntimeOnly "party.iroiro.luajava:lua54-platform:${libs.versions.luajava.get()}:natives-desktop"
    implementation libs.litertlm
    implementation libs.mlkit.translate
    implementation libs.tesseract4android
    implementation libs.androidx.customview
    // WebSockets, for Rambler live transcription.
    implementation libs.okhttp
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    implementation libs.tensorflow.lite
    // Dictation with Whisper on the phone.
    phoneImplementation project(':whisper')
    // Grants the permissions that settings need through Shizuku, when it is installed and running.
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
    testImplementation libs.junit
    testImplementation libs.json
    testImplementation libs.robolectric
}

// Gemini settings come from local.properties, which is not committed, so each builder uses their own key.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def geminiApiKey = localProperties.getProperty('gemini.api.key', '')
def geminiModel = localProperties.getProperty('gemini.model', 'gemini-flash-latest')
def distributionProfile = new groovy.json.JsonSlurper().parse(file('distribution-profile.json'))
def recoveryPublicKey = distributionProfile.publicKey ?: ''
if (distributionProfile.format != 2 || (recoveryPublicKey && !(recoveryPublicKey ==~ /SFPUB1\.[A-Za-z0-9_-]{60,700}/))) {
    throw new GradleException('Invalid distribution verification profile')
}

android {
    namespace = "com.google.android.accessibility.talkback"
    defaultConfig {
        buildConfigField("String", "APPLICATION_ID", '"' + talkbackApplicationId + '"')
        buildConfigField("String", "GEMINI_API_KEY", '"' + geminiApiKey + '"')
        buildConfigField("String", "GEMINI_MODEL", '"' + geminiModel + '"')
        buildConfigField("String", "SANDFLY_RECOVERY_PUBLIC_KEY", '"' + recoveryPublicKey + '"')
        // Used by the updater to compare this build with the latest development build.
        buildConfigField("String", "COMMIT_HASH", '"' + rootProject.gitCommitHash + '"')
        buildConfigField("int", "COMMIT_COUNT", String.valueOf(rootProject.gitCommitCount))
        buildConfigField("String", "MERIDIAN_VERSION", '"' + rootProject.meridianVersionName + '"')
        // Only the public verification key is bundled, never the private issuer key.
        buildConfigField("String", "SANDFLY_ISSUER_PUBLIC_KEY", '"' + (System.getenv("SANDFLY_ISSUER_PUBLIC_KEY")?.trim() ?: "SFPUB1.MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEX_2A5BEv5GUZYbT0L9WHesmH5nVKCoCtHL9Dvm8IuWTxUEcYYaLsTQH7tNeuHeJQMJ_3Tmb7HKCHXJoYzTzWtQ") + '"')
    }
    // Robolectric tests read the module's strings.
    testOptions.unitTests.includeAndroidResources = true
    // Robolectric's default repo1.maven.org endpoint returned HTTP 429 in GitHub CI.
    // Keep the unit tests enabled and use the canonical Maven Central host instead.
    testOptions.unitTests.all {
        systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"
    }
    buildFeatures {
        aidl = true
    }
    sourceSets.main.java.srcDir('../activation/src/main/java')
}

def currencyAssetDir = layout.buildDirectory.dir("generated/currency-model-assets")
def currencyModelFile = currencyAssetDir.map { it.file("vn_currency_yolo11n.tflite") }
def currencySourceCommit = "2c46d754c15f6739cb2467d29ebcb29ed1e4b4ec"
def currencyModelSha256 = "b3d3727f9ca1fb41789071e5590f7677bca83e9dd61505b322580c52251fddd9"
def prepareCurrencyModel = tasks.register("prepareCurrencyModel") {
    inputs.property("sourceCommit", currencySourceCommit)
    inputs.property("checksum", currencyModelSha256)
    outputs.file(currencyModelFile)
    doLast {
        def output = currencyModelFile.get().asFile
        output.parentFile.mkdirs()
        def source = "https://raw.githubusercontent.com/hezioquan12/vietnamese-money-vision/${currencySourceCommit}/android/app/src/main/assets/models/yolo26_money_quant.tflite"
        def temporary = new File(output.parentFile, output.name + ".tmp")
        try {
            def connection = new URI(source).toURL().openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 120000
            connection.inputStream.withCloseable { input ->
                temporary.withOutputStream { stream -> stream << input }
            }
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            digest.update(java.nio.file.Files.readAllBytes(temporary.toPath()))
            def observed = digest.digest().encodeHex().toString()
            if (!observed.equalsIgnoreCase(currencyModelSha256)) {
                throw new GradleException("Vietnamese currency model checksum mismatch: " + observed)
            }
            java.nio.file.Files.move(temporary.toPath(), output.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally {
            temporary.delete()
        }
    }
}
android.sourceSets.main.assets.srcDir(currencyAssetDir.get().asFile)
tasks.configureEach {
    if ((name.startsWith("merge") && name.endsWith("Assets")) ||
        name.toLowerCase(java.util.Locale.ROOT).contains("lint")) {
        dependsOn(prepareCurrencyModel)
    }
}

ext.activationDirectory = file('../activation')
apply from: new File(activationDirectory, 'service-assets.gradle')
